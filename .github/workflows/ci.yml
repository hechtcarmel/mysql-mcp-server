name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22', '24.15.0', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ !inputs.release && 'pnpm' || '' }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Lint GitHub Actions workflows
        if: matrix.node == '24'
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm pack --pack-destination /tmp/mysql-mcp-package
      - name: Record package checksum
        working-directory: /tmp/mysql-mcp-package
        run: |
          sha256sum -- *.tgz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: matrix.node == '24'
        with:
          name: npm-package
          path: /tmp/mysql-mcp-package/*
          if-no-files-found: error

  integration:
    needs: quality
    name: Integration (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        database: ['mysql:8.0', 'mysql:8.4', 'mariadb:11.4']
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: mcp-ci-password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmcp-ci-password --silent || mariadb-admin ping -h 127.0.0.1 -pmcp-ci-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: ${{ !inputs.release && 'pnpm' || '' }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:integration
        env:
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: ${{ job.services.mysql.ports['3306'] }}
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: mcp-ci-password
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: matrix.database == 'mysql:8.4'
        with:
          name: npm-package
          path: ${{ runner.temp }}/mysql-mcp-package
      - run: pnpm test:package
        if: matrix.database == 'mysql:8.4'
        env:
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: ${{ job.services.mysql.ports['3306'] }}
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: mcp-ci-password
          MYSQL_TEST_TARBALL_DIR: ${{ runner.temp }}/mysql-mcp-package

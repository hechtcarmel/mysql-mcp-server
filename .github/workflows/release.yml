name: Prepare release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to validate and prepare as a draft release (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate tag syntax before checkout
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module -e 'if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_TAG ?? "")) throw new Error("Invalid release tag")'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node scripts/validate-release.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag }}

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ inputs.tag }}
      release: true

  draft:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-package
          path: release-assets
      - name: Checksum the exact validated tarball
        working-directory: release-assets
        run: sha256sum -- *.tgz > SHA256SUMS
      - name: Prepare a draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/*.tgz release-assets/SHA256SUMS --draft --verify-tag --generate-notes --title "$RELEASE_TAG" "${flags[@]}"
